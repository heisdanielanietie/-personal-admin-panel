<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14171F;
    --panel:#1B1F29;
    --panel-2:#20242F;
    --border:#2A2F3B;
    --text:#E7E5E0;
    --muted:#8B8F99;
    --accent:#E8A33D;
    --accent-dim:rgba(232,163,61,0.14);
    --danger:#D9614F;
    --success:#6FBE8A;
    --radius:6px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    height:100vh;
    overflow:hidden;
  }
  ::selection{background:var(--accent-dim);}
  button{font-family:var(--font-body);cursor:pointer;}
  textarea, input{font-family:var(--font-body);}

  /* ---------- LOGIN ---------- */
  #login-view{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .login-card{
    width:320px;
    padding:32px 28px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .login-card h1{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    margin:0 0 4px;
  }
  .login-card p.sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 22px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:9px 10px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    font-size:14px;
  }
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn-primary{
    width:100%;
    padding:10px;
    margin-top:6px;
    background:var(--accent);
    border:none;
    border-radius:var(--radius);
    color:#1a1206;
    font-weight:600;
    font-size:14px;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .login-error{
    color:var(--danger);
    font-size:12.5px;
    margin-top:10px;
    min-height:16px;
  }

  /* ---------- APP SHELL ---------- */
  #app-view{
    display:none;
    height:100vh;
  }
  #app-view.active{display:flex;}

  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
  }
  .sidebar-header{
    padding:18px 16px 12px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-header h1{
    font-family:var(--font-display);
    font-size:16px;
    margin:0;
  }
  .project-list{
    flex:1;
    overflow-y:auto;
    padding:10px;
  }
  .project-item{
    padding:9px 10px;
    border-radius:var(--radius);
    color:var(--muted);
    font-size:13.5px;
    cursor:pointer;
    margin-bottom:2px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .project-item:hover{background:var(--panel-2);color:var(--text);}
  .project-item.active{background:var(--accent-dim);color:var(--accent);}
  .project-item .slug{font-size:11px;opacity:0.7;}

  .sidebar-footer{
    padding:12px;
    border-top:1px solid var(--border);
  }
  .btn-ghost{
    width:100%;
    padding:9px;
    background:transparent;
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--muted);
    font-size:13px;
  }
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .main-top{
    padding:16px 28px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .main-top h2{
    font-family:var(--font-display);
    font-size:18px;
    margin:0;
  }
  .main-top .status{
    font-size:12.5px;
    color:var(--muted);
  }
  .main-body{
    flex:1;
    overflow-y:auto;
    padding:24px 28px;
  }
  .empty-state{
    color:var(--muted);
    font-size:14px;
    max-width:320px;
    line-height:1.5;
  }

  .block-row{
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
    background:var(--panel);
  }
  .block-row-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .block-key{
    font-size:12px;
    color:var(--muted);
    font-family:monospace;
  }
  .block-row textarea{
    width:100%;
    min-height:52px;
    resize:vertical;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);
    padding:9px 10px;
    font-size:14px;
    line-height:1.4;
  }
  .block-row textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .block-save{
    font-size:12px;
    color:var(--accent);
    background:none;
    border:none;
    padding:0;
    visibility:hidden;
  }
  .block-save.dirty{visibility:visible;}
  .block-save-state{
    font-size:11.5px;
    color:var(--success);
    margin-left:8px;
  }
  .add-field-btn{
    background:none;
    border:1px dashed var(--border);
    color:var(--muted);
    border-radius:var(--radius);
    padding:9px 14px;
    font-size:13px;
  }
  .add-field-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- MOBILE ---------- */
  @media (max-width:720px){
    #app-view.active{flex-direction:column;}
    .sidebar{
      width:100%;
      border-right:none;
      border-bottom:1px solid var(--border);
      max-height:38vh;
    }
    .main-top{padding:14px 16px;}
    .main-body{padding:16px;}
  }
</style>
</head>
<body>

  <!-- ============ LOGIN VIEW ============ -->
  <div id="login-view">
    <div class="login-card">
      <h1>Admin</h1>
      <p class="sub">Sign in to manage your projects.</p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <button class="btn-primary" id="login-btn">Sign in</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- ============ APP VIEW ============ -->
  <div id="app-view">
    <div class="sidebar">
      <div class="sidebar-header"><h1>Projects</h1></div>
      <div class="project-list" id="project-list"></div>
      <div class="sidebar-footer">
        <button class="btn-ghost" id="new-project-btn">+ New project</button>
      </div>
    </div>
    <div class="main">
      <div class="main-top">
        <h2 id="main-title">Select a project</h2>
        <span class="status" id="main-status"></span>
      </div>
      <div class="main-body" id="main-body">
        <div class="empty-state">Pick a project on the left, or create a new one to get started.</div>
      </div>
    </div>
  </div>

<script>
  // ---- Fill these in from Supabase → Project Settings → API ----
  const SUPABASE_URL = "https://wziaefgyrkuhifgihhts.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6aWFlZmd5cmt1aGlmZ2loaHRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTQ4NDUsImV4cCI6MjEwNDc5MDg0NX0.EfRo0vOVc0zfwxTps6UArhRs4Gc9PjVMZJeIKB9Mnc8";
  // ----------------------------------------------------------------

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let projects = [];
  let currentProjectId = null;

  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");
  const loginError = document.getElementById("login-error");
  const projectList = document.getElementById("project-list");
  const mainTitle = document.getElementById("main-title");
  const mainStatus = document.getElementById("main-status");
  const mainBody = document.getElementById("main-body");

  // ---------- AUTH ----------
  document.getElementById("login-btn").addEventListener("click", signIn);
  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") signIn();
  });

  async function signIn() {
    loginError.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      loginError.textContent = error.message;
      return;
    }
    showApp();
  }

  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) showApp();
  }
  checkSession();

  function showApp() {
    loginView.style.display = "none";
    appView.classList.add("active");
    loadProjects();
  }

  // ---------- PROJECTS ----------
  async function loadProjects() {
    const { data, error } = await supabaseClient
      .from("projects")
      .select("*")
      .order("created_at", { ascending: true });
    if (error) {
      projectList.innerHTML = `<div class="empty-state">Couldn't load projects: ${error.message}</div>`;
      return;
    }
    projects = data;
    renderProjectList();
  }

  function renderProjectList() {
    projectList.innerHTML = "";
    projects.forEach((p) => {
      const item = document.createElement("div");
      item.className = "project-item" + (p.id === currentProjectId ? " active" : "");
      item.innerHTML = `<span>${escapeHtml(p.name)}</span><span class="slug">${escapeHtml(p.slug)}</span>`;
      item.addEventListener("click", () => selectProject(p.id));
      projectList.appendChild(item);
    });
  }

  document.getElementById("new-project-btn").addEventListener("click", async () => {
    const name = prompt("Project name (e.g. My Portfolio):");
    if (!name) return;
    const slug = prompt(
      "Project slug — must match PROJECT_SLUG in that project's cms-embed.js:",
      name.toLowerCase().replace(/[^a-z0-9]+/g, "-")
    );
    if (!slug) return;
    const { error } = await supabaseClient.from("projects").insert({ name, slug });
    if (error) { alert("Couldn't create project: " + error.message); return; }
    loadProjects();
  });

  // ---------- CONTENT BLOCKS ----------
  async function selectProject(id) {
    currentProjectId = id;
    renderProjectList();
    const project = projects.find((p) => p.id === id);
    mainTitle.textContent = project.name;
    mainStatus.textContent = "";
    mainBody.innerHTML = `<div class="empty-state">Loading…</div>`;

    const { data, error } = await supabaseClient
      .from("content_blocks")
      .select("*")
      .eq("project_id", id)
      .order("key", { ascending: true });

    if (error) {
      mainBody.innerHTML = `<div class="empty-state">Couldn't load fields: ${error.message}</div>`;
      return;
    }
    renderBlocks(data);
  }

  function renderBlocks(blocks) {
    mainBody.innerHTML = "";

    if (blocks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No fields yet. Add one below, then reference its key with data-cms-key in your site's HTML.";
      mainBody.appendChild(empty);
    }

    blocks.forEach((block) => {
      const row = document.createElement("div");
      row.className = "block-row";
      row.innerHTML = `
        <div class="block-row-top">
          <span class="block-key">${escapeHtml(block.key)}</span>
          <span>
            <button class="block-save">Save</button>
            <span class="block-save-state"></span>
          </span>
        </div>
        <textarea>${escapeHtml(block.value || "")}</textarea>
      `;
      const textarea = row.querySelector("textarea");
      const saveBtn = row.querySelector(".block-save");
      const saveState = row.querySelector(".block-save-state");

      textarea.addEventListener("input", () => {
        saveBtn.classList.add("dirty");
        saveState.textContent = "";
      });

      saveBtn.addEventListener("click", async () => {
        saveState.textContent = "Saving…";
        const { error } = await supabaseClient
          .from("content_blocks")
          .update({ value: textarea.value, updated_at: new Date().toISOString() })
          .eq("id", block.id);
        if (error) {
          saveState.textContent = "Failed: " + error.message;
          saveState.style.color = "var(--danger)";
          return;
        }
        saveBtn.classList.remove("dirty");
        saveState.style.color = "var(--success)";
        saveState.textContent = "Saved ✓";
        setTimeout(() => { saveState.textContent = ""; }, 2000);
      });

      mainBody.appendChild(row);
    });

    const addBtn = document.createElement("button");
    addBtn.className = "add-field-btn";
    addBtn.textContent = "+ Add field";
    addBtn.addEventListener("click", async () => {
      const key = prompt("Field key (e.g. hero_title) — matches data-cms-key in your HTML:");
      if (!key) return;
      const { error } = await supabaseClient
        .from("content_blocks")
        .insert({ project_id: currentProjectId, key, value: "" });
      if (error) { alert("Couldn't add field: " + error.message); return; }
      selectProject(currentProjectId);
    });
    mainBody.appendChild(addBtn);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
